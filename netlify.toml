[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# On-demand resume/cover-letter generation (see index.html -> generateJob)
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

# Saved-applications library reads/deletes (see index.html -> saved panel)
[[redirects]]
  from = "/api/applications"
  to = "/.netlify/functions/applications"
  status = 200