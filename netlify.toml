[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[[redirects]]
  from = "/api/gate"
  to = "/.netlify/functions/gate"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

[[redirects]]
  from = "/api/ingest"
  to = "/.netlify/functions/ingest"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/ai-request"
  to = "/.netlify/functions/ai-request"
  status = 200

[[redirects]]
  from = "/api/generate-pack"
  to = "/.netlify/functions/generate-pack"
  status = 200

[[redirects]]
  from = "/api/discover"
  to = "/.netlify/functions/discover"
  status = 200

[[redirects]]
  from = "/api/documents"
  to = "/.netlify/functions/documents"
  status = 200

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/apply"
  status = 200

[[cron]]
  function = "discover"
  schedule = "0 7 * * *"
