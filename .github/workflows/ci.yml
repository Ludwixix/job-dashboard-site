name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  RUFF_VERSION: "0.16.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==${{ env.RUFF_VERSION }}
      - run: ruff check . --exclude _archive/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Supabase Edge Functions parse
        run: |
          node --check supabase/functions/generate/index.ts
          node --check supabase/functions/applications/index.ts
      - name: Verify index.html exists
        run: |
          test -f index.html && echo "index.html present" || (echo "MISSING index.html" && exit 1)
