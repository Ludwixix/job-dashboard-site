name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check . --exclude _archive/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify dashboard can generate
        run: |
          python3 -c "
          import ast, sys
          with open('build_nonlinkedin_dashboard.py') as f:
              ast.parse(f.read())
          print('Dashboard script parses OK')
          "
      - name: Verify index.html exists
        run: |
          test -f index.html && echo "index.html present" || (echo "MISSING index.html" && exit 1)
